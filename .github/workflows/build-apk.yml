name: Build and Release Opriva Patient APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses & Enable Android
        run: |
          flutter config --no-analytics
          yes | flutter doctor --android-licenses || true

      - name: Prepare Android Platform Files
        run: |
          cd opriva-mobile
          # Backup our complete custom code and config
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          
          # Remove android scaffolding and let Flutter generate canonical Android files
          rm -rf android test
          flutter create . --platforms=android --org com.opriva --project-name opriva_mobile
          
          # Restore code and dependencies, and remove default counter widget test
          rm -rf lib test
          cp -r /tmp/lib_bak lib
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          
          # Safely update AndroidManifest.xml and disable lintVital aborts with Python
          python3 -c "
          import os

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              data = f.read()
          perms = '''    <uses-permission android:name=\"android.intent.action.INTERNET\"/>\n    <uses-permission android:name=\"android.intent.action.ACCESS_FINE_LOCATION\"/>\n    <uses-permission android:name=\"android.intent.action.ACCESS_COARSE_LOCATION\"/>\n'''
          if 'android.permission.INTERNET' not in data:
              data = data.replace('<application', perms + '    <application')
          data = data.replace('android:label=\"opriva_mobile\"', 'android:label=\"Opriva\"')
          with open(manifest_path, 'w') as f:
              f.write(data)
          print('AndroidManifest updated successfully')

          kts_file = 'android/app/build.gradle.kts'
          groovy_file = 'android/app/build.gradle'

          if os.path.exists(kts_file):
              with open(kts_file, 'r') as f:
                  text = f.read()
              lint_block = '\n    lint {\n        abortOnError = false\n        checkReleaseBuilds = false\n    }\n'
              if 'lint {' not in text:
                  text = text.replace('android {', 'android {' + lint_block)
              with open(kts_file, 'w') as f:
                  f.write(text)
              print('Configured lint in build.gradle.kts')

          if os.path.exists(groovy_file):
              with open(groovy_file, 'r') as f:
                  text = f.read()
              lint_block = '\n    lintOptions {\n        abortOnError false\n        checkReleaseBuilds false\n    }\n'
              if 'lintOptions {' not in text:
                  text = text.replace('android {', 'android {' + lint_block)
              with open(groovy_file, 'w') as f:
                  f.write(text)
              print('Configured lint in build.gradle')
          "

          # Fetch Flutter packages
          flutter pub get

      - name: Build Release APK
        run: |
          cd opriva-mobile
          flutter build apk --release --no-tree-shake-icons -v > /tmp/flutter_build.log 2>&1 || {
            ERR=$(grep -A 8 -m 1 "What went wrong:" /tmp/flutter_build.log | tr '\n' ' ' | head -c 250)
            if [ -z "$ERR" ]; then
              ERR=$(grep -C 3 -m 1 "FAILURE:" /tmp/flutter_build.log | tr '\n' ' ' | head -c 250)
            fi
            echo "::error title=Gradle Root Cause::$ERR"
            echo "===== LAST 100 LINES OF FLUTTER BUILD LOG ====="
            tail -n 100 /tmp/flutter_build.log
            exit 1
          }

      - name: Upload Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: /tmp/flutter_build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Opriva-Patient-App
          path: opriva-mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Opriva Patient App v1.0.0 (Android APK)"
          body: |
            ### 🏥 Opriva — Healthcare, Without the Wait.
            Official Android APK download for the Opriva Patient Mobile Application.

            **Features in this release:**
            - 📍 Discover nearest verified hospitals first with genuine Google Ratings.
            - 🎫 Select Normal OP Card (₹350) or Special Priority OP Card (₹750).
            - 📋 Patient & dependent registration with previous report upload.
            - ⏱️ 10-minute slot hold timer + UPI QR scanner payment.
            - 🔔 Live queue token tracking with estimated wait times and reception desk contact.
            - 🌐 Native 12 Indian languages support + Urdu RTL.
          files: opriva-mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
