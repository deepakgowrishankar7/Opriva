name: Build and Release Opriva Patient APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Prepare Android Platform Files
        run: |
          cd opriva-mobile
          # Backup our complete custom code and config
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          
          # Remove broken scaffolding and let Flutter generate canonical Android files
          rm -rf android
          flutter create . --platforms=android --org com.opriva --project-name opriva_mobile
          
          # Restore code and dependencies
          rm -rf lib
          cp -r /tmp/lib_bak lib
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          
          # Configure custom app title and network permissions
          sed -i 's/android:label="opriva_mobile"/android:label="Opriva"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.intent.action.INTERNET"/>\n    <uses-permission android:name="android.intent.action.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.intent.action.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml
          
          # Fetch Flutter packages
          flutter pub get

      - name: Build Release APK
        run: |
          cd opriva-mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Opriva-Patient-App
          path: opriva-mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Opriva Patient App v1.0.0 (Android APK)"
          body: |
            ### 🏥 Opriva — Healthcare, Without the Wait.
            Official Android APK download for the Opriva Patient Mobile Application.

            **Features in this release:**
            - 📍 Discover nearest verified hospitals first with genuine Google Ratings.
            - 🎫 Select Normal OP Card (₹350) or Special Priority OP Card (₹750).
            - 📋 Patient & dependent registration with previous report upload.
            - ⏱️ 10-minute slot hold timer + UPI QR scanner payment.
            - 🔔 Live queue token tracking with estimated wait times and reception desk contact.
            - 🌐 Native 12 Indian languages support + Urdu RTL.
          files: opriva-mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
